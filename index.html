<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reze Beside</title>
    <style>
      /* Every layer transparent, all the way down. A single opaque background
         anywhere in this chain is an opaque rectangle on the desktop, which is
         the one thing the whole shell exists to avoid. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
